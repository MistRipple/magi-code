<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magi 服务恢复</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --bg: #f7f8fa;
        --fg: #20242c;
        --muted: #667085;
        --border: #d8dde6;
        --primary: #176b5b;
        --danger: #b33b42;
        --warning: #b7791f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15181d;
          --fg: #edf0f4;
          --muted: #a4acb9;
          --border: #343a45;
          --primary: #43aa91;
          --danger: #e06c75;
          --warning: #e4ad4f;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(560px, calc(100vw - 40px));
        text-align: center;
      }
      .status-icon {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        margin-bottom: 14px;
        color: var(--warning);
        font-size: 28px;
      }
      .status-icon.busy { animation: spin 1s linear infinite; }
      h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: 0; }
      #hint { max-width: 480px; margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
      #processes { width: min(520px, 100%); margin-top: 18px; border-block: 1px solid var(--border); }
      .process {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 4px 12px;
        padding: 10px 2px;
        text-align: left;
        font-size: 12px;
      }
      .process + .process { border-top: 1px solid var(--border); }
      .process code { color: var(--muted); }
      .process-path { grid-column: 1 / -1; overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
      #error { max-width: 520px; margin: 14px 0 0; color: var(--danger); font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
      #actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 20px; }
      button {
        min-height: 34px;
        padding: 0 13px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: var(--fg);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      button.primary { border-color: var(--primary); background: var(--primary); color: white; }
      button.danger { border-color: var(--danger); background: var(--danger); color: white; }
      button:disabled { cursor: default; opacity: .55; }
      details { width: min(520px, 100%); margin-top: 18px; color: var(--muted); text-align: left; font-size: 12px; }
      summary { cursor: pointer; }
      pre { max-height: 150px; margin: 8px 0 0; padding: 10px 0; overflow: auto; border-top: 1px solid var(--border); color: var(--fg); font-size: 11px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
      [hidden] { display: none !important; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main>
      <div id="icon" class="status-icon">!</div>
      <h1 id="title">正在诊断 Magi 本地服务</h1>
      <p id="hint">正在检查固定端口和运行进程，请稍候。</p>
      <div id="processes" hidden></div>
      <p id="error" hidden></p>
      <div id="actions"></div>
      <details id="details" hidden>
        <summary>技术详情</summary>
        <pre id="technical-detail"></pre>
      </details>
    </main>
    <script>
      const invoke = window.__TAURI__?.core?.invoke;
      const elements = {
        icon: document.querySelector('#icon'),
        title: document.querySelector('#title'),
        hint: document.querySelector('#hint'),
        processes: document.querySelector('#processes'),
        error: document.querySelector('#error'),
        actions: document.querySelector('#actions'),
        details: document.querySelector('#details'),
        technicalDetail: document.querySelector('#technical-detail'),
      };
      let snapshot = null;
      let busy = false;
      let confirmingExternal = false;
      let confirmingEnvironmentRecovery = false;

      function createButton(label, tone, handler) {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = label;
        button.className = tone;
        button.disabled = busy;
        button.addEventListener('click', handler);
        return button;
      }

      function statusCopy(value) {
        if (!value) return ['Magi 本地服务不可用', '可以重新检测当前运行状态。'];
        if (confirmingExternal) {
          return ['确认结束占用进程', '这会结束下列非 Magi 进程。请再次核对进程名称和路径。'];
        }
        if (confirmingEnvironmentRecovery) {
          return ['确认恢复运行环境', '这会停止当前本地服务、释放固定端口并重新启动运行环境。正在运行的任务会被记录为重启中断。'];
        }
        switch (value.status) {
          case 'port-occupied':
            return [
              `端口 ${value.port} 已被占用`,
              value.requiresConfirmation
                ? '另一个程序正在使用 Magi 的固定端口。确认进程信息后，可结束该进程并重启服务。'
                : '检测到旧 Magi 进程仍占用固定端口，可以安全停止旧进程并恢复工作台。',
            ];
          case 'restarting': return ['正在重启 Magi 本地服务', '正在停止旧进程、释放端口并恢复工作台。'];
          case 'ready': return ['Magi 工作台尚未恢复', '本地服务仍有响应，需要重建运行环境才能恢复当前工作区。'];
          case 'failed': return ['Magi 本地服务启动失败', '当前错误无法自动恢复，请查看技术详情后处理。'];
          default: return ['Magi 本地服务不可用', '可以重启服务并恢复关闭前的工作区和会话。'];
        }
      }

      function render() {
        const [title, hint] = statusCopy(snapshot);
        elements.title.textContent = title;
        elements.hint.textContent = hint;
        elements.icon.textContent = busy ? '↻' : '!';
        elements.icon.classList.toggle('busy', busy);

        elements.processes.replaceChildren();
        for (const occupant of snapshot?.occupants || []) {
          const row = document.createElement('div');
          row.className = 'process';
          const name = document.createElement('span');
          name.textContent = occupant.processName;
          const pid = document.createElement('code');
          pid.textContent = `PID ${occupant.pid}`;
          row.append(name, pid);
          if (occupant.executablePath) {
            const path = document.createElement('span');
            path.className = 'process-path';
            path.textContent = occupant.executablePath;
            path.title = occupant.executablePath;
            row.append(path);
          }
          elements.processes.append(row);
        }
        elements.processes.hidden = elements.processes.childElementCount === 0;
        elements.details.hidden = !snapshot?.technicalDetail;
        elements.technicalDetail.textContent = snapshot?.technicalDetail || '';

        elements.actions.replaceChildren();
        if (confirmingExternal || confirmingEnvironmentRecovery) {
          elements.actions.append(
            createButton('取消', '', () => { confirmingExternal = false; confirmingEnvironmentRecovery = false; render(); }),
            createButton(confirmingExternal ? '确认结束并重启' : '确认恢复运行环境', 'danger', () => restart(confirmingExternal)),
          );
          return;
        }
        if (snapshot?.status === 'ready') {
          if (snapshot.canRestart) {
            elements.actions.append(createButton('恢复运行环境', 'primary', () => {
              if (snapshot.requiresConfirmation) {
                confirmingExternal = true;
              } else {
                confirmingEnvironmentRecovery = true;
              }
              render();
            }));
          }
        }
        if (snapshot?.canRestart) {
          if (snapshot.status === 'ready') {
            elements.actions.append(createButton('重新检测', '', diagnose));
            return;
          }
          elements.actions.append(createButton(
            snapshot.requiresConfirmation ? '结束进程并重启' : '重启 Magi 服务',
            'primary',
            () => {
              if (snapshot.requiresConfirmation) {
                confirmingExternal = true;
                render();
              } else {
                restart(false);
              }
            },
          ));
        }
        elements.actions.append(createButton('重新检测', '', diagnose));
      }

      async function diagnose() {
        if (!invoke) {
          elements.error.textContent = '桌面恢复接口不可用，请完全退出 Magi 后重新打开。';
          elements.error.hidden = false;
          return;
        }
        busy = true;
        elements.error.hidden = true;
        render();
        try {
          snapshot = await invoke('get_desktop_runtime_recovery');
        } catch (error) {
          elements.error.textContent = String(error);
          elements.error.hidden = false;
        } finally {
          busy = false;
          render();
        }
      }

      async function restart(confirmExternalProcesses) {
        if (!snapshot || !invoke) return;
        busy = true;
        confirmingExternal = false;
        confirmingEnvironmentRecovery = false;
        elements.error.hidden = true;
        render();
        try {
          snapshot = await invoke('restart_desktop_runtime', {
            request: {
              expectedOccupants: snapshot.occupants.map(({ pid, startedAt }) => ({ pid, startedAt })),
              confirmExternalProcesses,
            },
          });
        } catch (error) {
          const restartError = String(error);
          await diagnose();
          elements.error.textContent = restartError;
          elements.error.hidden = false;
        } finally {
          busy = false;
          render();
        }
      }

      diagnose();
    </script>
  </body>
</html>
