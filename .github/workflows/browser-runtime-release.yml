name: 发布 Browser Runtime

on:
  workflow_dispatch:
    inputs:
      update_level:
        description: 更新级别
        required: true
        default: recommended
        type: choice
        options:
          - optional
          - recommended
          - required_security
      expires_days:
        description: 清单有效期天数
        required: true
        default: '90'
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: browser-runtime-stable-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: '1.97.0'
  BROWSER_RUNTIME_EXPIRES_DAYS: ${{ vars.BROWSER_RUNTIME_EXPIRES_DAYS || '90' }}
  BROWSER_RUNTIME_UPDATE_LEVEL: ${{ vars.BROWSER_RUNTIME_UPDATE_LEVEL || 'recommended' }}

jobs:
  prepare-release:
    name: 准备 Browser Runtime 发布
    runs-on: ubuntu-22.04
    outputs:
      magi_version: ${{ steps.release.outputs.magi_version }}
      runtime_version: ${{ steps.release.outputs.runtime_version }}
      minimum_magi_version: ${{ steps.release.outputs.minimum_magi_version }}
      manifest_sequence: ${{ steps.release.outputs.manifest_sequence }}
      expires_days: ${{ steps.release.outputs.expires_days }}
      update_level: ${{ steps.release.outputs.update_level }}
    steps:
      - name: 检出发布版本
        uses: actions/checkout@v7

      - name: 生成发布序列
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          magi_version="$(node scripts/product-version.mjs)"
          minimum_magi_version="$magi_version"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            test "$tag_version" = "$magi_version" || {
              echo "产品标签 $tag_version 与 Cargo workspace 版本 $magi_version 不一致。" >&2
              exit 1
            }
          fi

          sequence_floor="$(node scripts/browser-runtime-manifest-sequence.mjs "$magi_version")"
          highest_sequence=0
          feed_dir="$(mktemp -d)"
          if gh release view browser-runtime-stable --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download browser-runtime-stable \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'release-*.json' \
              --dir "$feed_dir" \
              --clobber
            while IFS= read -r feed; do
              candidate="$(jq -er '.release.manifest.manifest_sequence' "$feed")"
              [[ "$candidate" =~ ^[0-9]+$ ]] || {
                echo "Browser Runtime 稳定清单序列无效：$feed" >&2
                exit 1
              }
              if (( candidate > highest_sequence )); then
                highest_sequence="$candidate"
              fi
            done < <(find "$feed_dir" -maxdepth 1 -type f -name 'release-*.json' -print)
          fi
          if (( highest_sequence >= sequence_floor )); then
            manifest_sequence=$((highest_sequence + 1))
          else
            manifest_sequence="$sequence_floor"
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            expires_days="${{ inputs.expires_days }}"
            update_level="${{ inputs.update_level }}"
          else
            expires_days="$BROWSER_RUNTIME_EXPIRES_DAYS"
            update_level="$BROWSER_RUNTIME_UPDATE_LEVEL"
          fi
          [[ "$expires_days" =~ ^[1-9][0-9]*$ ]]
          case "$update_level" in optional|recommended|required_security) ;; *) exit 1 ;; esac

          {
            echo "magi_version=$magi_version"
            echo "runtime_version=$magi_version"
            echo "minimum_magi_version=$minimum_magi_version"
            echo "manifest_sequence=$manifest_sequence"
            echo "expires_days=$expires_days"
            echo "update_level=$update_level"
          } >> "$GITHUB_OUTPUT"

  package:
    name: 打包 ${{ matrix.platform }} Browser Runtime
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15
            runtime_os: macos
            runtime_arch: aarch64
          - platform: macos-intel
            runner: macos-15-intel
            runtime_os: macos
            runtime_arch: x86_64
          - platform: linux
            runner: ubuntu-22.04
            runtime_os: linux
            runtime_arch: x86_64
          - platform: windows
            runner: windows-2022
            runtime_os: windows
            runtime_arch: x86_64

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser-host/package-lock.json

      - name: 安装 Rust
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"

      - name: 安装 Browser Host 依赖
        shell: bash
        run: npm --prefix browser-host ci

      - name: 下载 Playwright Chromium
        shell: bash
        run: npm --prefix browser-host exec -- playwright-core install chromium

      - name: 构建 Browser Host
        shell: bash
        run: npm --prefix browser-host run build

      - name: Browser Host 协议回归
        shell: bash
        run: |
          set -euo pipefail
          chromium_executable="$(node -e "console.log(require('./browser-host/node_modules/playwright-core').chromium.executablePath())")"
          MAGI_BROWSER_TEST_CHROMIUM="$chromium_executable" npm --prefix browser-host test

      - name: 准备独立运行组件
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-browser-runtime.mjs \
            --root dist/browser-runtime-root \
            --metadata dist/browser-runtime-metadata.json

      - name: Browser Runtime 协议回归
        shell: bash
        run: |
          set -euo pipefail
          node scripts/self-test-browser-runtime.mjs \
            --metadata dist/browser-runtime-metadata.json

      - name: 生成签名 Runtime 归档
        shell: bash
        env:
          MAGI_BROWSER_RUNTIME_SIGNING_KEY_HEX: ${{ secrets.MAGI_BROWSER_RUNTIME_SIGNING_KEY_HEX }}
        run: |
          set -euo pipefail
          BROWSER_RUNTIME_RELEASE_KEY_HEX="$(node scripts/browser-runtime-release-config.mjs public-key)"
          test -n "${MAGI_BROWSER_RUNTIME_SIGNING_KEY_HEX:-}" || {
            echo '缺少 Secret: MAGI_BROWSER_RUNTIME_SIGNING_KEY_HEX' >&2
            exit 1
          }
          magi_version="${{ needs.prepare-release.outputs.magi_version }}"
          runtime_version="${{ needs.prepare-release.outputs.runtime_version }}"
          minimum_magi_version="${{ needs.prepare-release.outputs.minimum_magi_version }}"
          sequence="${{ needs.prepare-release.outputs.manifest_sequence }}"
          expires_days="${{ needs.prepare-release.outputs.expires_days }}"
          update_level="${{ needs.prepare-release.outputs.update_level }}"
          test -n "$runtime_version"
          test -n "$sequence"
          test -n "$expires_days"
          test -n "$update_level"
          metadata='dist/browser-runtime-metadata.json'
          node_version="$(node -p "JSON.parse(require('fs').readFileSync('$metadata')).nodeVersion")"
          playwright_version="$(node -p "JSON.parse(require('fs').readFileSync('$metadata')).playwrightVersion")"
          chromium_version="$(node -p "JSON.parse(require('fs').readFileSync('$metadata')).chromiumVersion")"
          node_path="$(node -p "JSON.parse(require('fs').readFileSync('$metadata')).nodeExecutablePath")"
          host_path="$(node -p "JSON.parse(require('fs').readFileSync('$metadata')).hostEntryPath")"
          chromium_path="$(node -p "JSON.parse(require('fs').readFileSync('$metadata')).chromiumExecutablePath")"
          archive_name="magi-browser-runtime-${runtime_version}-${{ matrix.runtime_os }}-${{ matrix.runtime_arch }}.tar.zst"
          archive_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/browser-runtime-v${runtime_version}/${archive_name}"
          cargo run --locked -p magi-browser-runtime --bin package-browser-runtime -- \
            --root dist/browser-runtime-root \
            --output-dir dist/browser-runtime \
            --runtime-version "$runtime_version" \
            --host-version "$magi_version" \
            --node-version "$node_version" \
            --playwright-version "$playwright_version" \
            --chromium-version "$chromium_version" \
            --os '${{ matrix.runtime_os }}' \
            --arch '${{ matrix.runtime_arch }}' \
            --manifest-sequence "$sequence" \
            --expires-days "$expires_days" \
            --minimum-magi-version "$minimum_magi_version" \
            --minimum-safe-runtime-version "$runtime_version" \
            --node-executable-path "$node_path" \
            --host-entry-path "$host_path" \
            --chromium-executable-path "$chromium_path" \
            --archive-url "$archive_url" \
            --channel stable \
            --update-level "$update_level" \
            --verify-install-root dist/browser-runtime-verified \
            --expected-public-key-hex "$BROWSER_RUNTIME_RELEASE_KEY_HEX"
          test -s "dist/browser-runtime/$archive_name"
          test -s "dist/browser-runtime/release-${{ matrix.runtime_os }}-${{ matrix.runtime_arch }}.json"

      - name: 上传 Browser Runtime 产物
        uses: actions/upload-artifact@v7
        with:
          name: browser-runtime-${{ matrix.platform }}
          path: dist/browser-runtime
          if-no-files-found: error

  publish:
    name: 发布 Browser Runtime 清单与归档
    needs: [prepare-release, package]
    runs-on: ubuntu-22.04
    steps:
      - name: 检出发布版本
        uses: actions/checkout@v7

      - name: 下载各平台产物
        uses: actions/download-artifact@v8
        with:
          pattern: browser-runtime-*
          path: dist/browser-runtime
          merge-multiple: true

      - name: 发布版本 Runtime Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runtime_version="${{ needs.prepare-release.outputs.runtime_version }}"
          runtime_tag="browser-runtime-v${runtime_version}"
          gh release view "$runtime_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$runtime_tag" --repo "$GITHUB_REPOSITORY" --title "Magi Browser Runtime ${runtime_tag#browser-runtime-v}" --notes 'Magi 独立 Browser Runtime 组件。'
          gh release upload "$runtime_tag" \
            --repo "$GITHUB_REPOSITORY" \
            dist/browser-runtime/magi-browser-runtime-*.tar.zst \
            dist/browser-runtime/signed-release-*.json \
            dist/browser-runtime/release-*.json \
            --clobber
