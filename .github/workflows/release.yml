name: 发布 Electron Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  verify-ci:
    name: 校验发布提交
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: 等待同一提交通过持续集成
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1200))
          missing_attempts=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --limit 20 --json status,conclusion,url)"
            latest="$(jq -c '.[0] // empty' <<<"$runs")"
            if [ -z "$latest" ]; then
              missing_attempts=$((missing_attempts + 1))
              [ "$missing_attempts" -lt 4 ] || { echo "未找到提交 $GITHUB_SHA 的持续集成记录。" >&2; exit 1; }
              sleep 15
              continue
            fi
            status="$(jq -r '.status' <<<"$latest")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$latest")"
            if [ "$status" = completed ]; then
              [ "$conclusion" = success ] || { echo "持续集成未通过：$(jq -r '.url' <<<"$latest")" >&2; exit 1; }
              exit 0
            fi
            sleep 15
          done
          echo "等待持续集成超时。" >&2
          exit 1

  prepare-release:
    name: 校验单一发行输入
    needs: verify-ci
    runs-on: ubuntu-22.04
    outputs:
      product_version: ${{ steps.version.outputs.product_version }}
    steps:
      - name: 检出发布版本
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: 安装锁定依赖
        run: npm ci
      - name: 校验产品版本和发布说明
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node scripts/product-version.mjs)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$version"
            test -s ".github/releases/${GITHUB_REF_NAME}.md"
          fi
          echo "product_version=$version" >> "$GITHUB_OUTPUT"
      - name: 校验唯一 Electron 发行边界
        run: npm run release:guard

  package-desktop:
    name: 打包 ${{ matrix.platform }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            os: macos
            arch: arm64
          - platform: macos-x64
            runner: macos-15-intel
            os: macos
            arch: x64
          - platform: linux-x64
            runner: ubuntu-22.04
            os: linux
            arch: x64
          - platform: windows-x64
            runner: windows-2022
            os: windows
            arch: x64
    steps:
      - name: 检出发布版本
        uses: actions/checkout@v7
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: 安装锁定依赖
        run: npm ci
      - name: 安装 Rust
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: electron-release-${{ matrix.platform }}
      - name: 安装 Linux 运行验收依赖
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2 libgtk-3-0 libnss3 xauth xvfb
      - name: 校验唯一 Electron 发行边界
        run: npm run release:guard
      - name: 配置 macOS Developer ID 与公证
        if: matrix.os == 'macos'
        shell: bash
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in MACOS_CSC_LINK MACOS_CSC_KEY_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            test -n "${!name:-}" || { echo "缺少签名 Secret: $name" >&2; exit 1; }
          done
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
      - name: 校验 Windows Authenticode 证书
        if: matrix.os == 'windows'
        shell: bash
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${WINDOWS_CSC_LINK:-}" || { echo "缺少签名 Secret: WINDOWS_CSC_LINK" >&2; exit 1; }
          test -n "${WINDOWS_CSC_KEY_PASSWORD:-}" || { echo "缺少签名 Secret: WINDOWS_CSC_KEY_PASSWORD" >&2; exit 1; }
      - name: 构建 Web、Worker、daemon、Electron 并组装安装包
        shell: bash
        env:
          MAGI_REQUIRE_CODE_SIGNING: "${{ matrix.os == 'linux' && '0' || '1' }}"
          CSC_LINK: ${{ matrix.os == 'macos' && secrets.MACOS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos' && secrets.MACOS_CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ matrix.os == 'windows' && secrets.WINDOWS_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.os == 'windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run desktop:package
      - name: 公证并装订 macOS 磁盘映像
        if: matrix.os == 'macos'
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          dmg="$(find target/electron-dist -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -s "$dmg"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
      - name: 校验 macOS 代码签名
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find target/electron-dist -type d -name 'Magi.app' -print -quit)"
          test -d "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
      - name: 校验 Windows Authenticode 签名
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem target/electron-dist -Recurse -File -Filter *.exe
          if ($files.Count -lt 3) { throw "Windows 发行包缺少主程序、daemon 或安装器" }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne "Valid") { throw "签名无效: $($file.FullName) [$($signature.Status)]" }
          }
      - name: 真实启动解包 Desktop
        if: matrix.os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          export MAGI_STATE_ROOT="$RUNNER_TEMP/magi-smoke"
          if [[ "${{ matrix.os }}" == macos ]]; then
            executable="$(find target/electron-dist -path '*/Magi.app/Contents/MacOS/Magi' -type f -print -quit)"
            "$executable" > "$RUNNER_TEMP/magi-smoke.log" 2>&1 &
          else
            executable="$(find target/electron-dist -path '*/linux-unpacked/Magi' -type f -print -quit)"
            xvfb-run -a "$executable" > "$RUNNER_TEMP/magi-smoke.log" 2>&1 &
          fi
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do curl -fsS http://127.0.0.1:38123/health >/dev/null && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:38123/health >/dev/null
          curl -fsS http://127.0.0.1:38123/web.html >/dev/null
      - name: 真实启动 Windows 解包 Desktop
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $env:MAGI_STATE_ROOT = "$env:RUNNER_TEMP\magi-smoke"
          $executable = Get-ChildItem target/electron-dist -Recurse -File -Filter Magi.exe | Where-Object { $_.FullName -match 'win-unpacked' } | Select-Object -First 1
          if (-not $executable) { throw "缺少 Windows 解包主程序" }
          $process = Start-Process $executable.FullName -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 120; $i++) {
              try { if ((Invoke-WebRequest http://127.0.0.1:38123/health -UseBasicParsing).StatusCode -eq 200) { $ready = $true; break } } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw "Windows Desktop smoke test 超时" }
            Invoke-WebRequest http://127.0.0.1:38123/web.html -UseBasicParsing | Out-Null
          } finally { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
      - name: 暂存同一发行包产物
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.prepare-release.outputs.product_version }}'
          output="dist/package-assets"
          mkdir -p "$output"
          while IFS= read -r file; do cp "$file" "$output/$(basename "$file")"; done < <(find target/electron-dist -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.blockmap' -o -name 'latest*.yml' \) -print)
          cp apps/desktop/dist/resources/browser-capability-manifest.json "$output/Magi-${version}-${{ matrix.platform }}-browser-capability-manifest.json"
          cp apps/desktop/dist/resources/sbom/magi-desktop.cdx.json "$output/Magi-${version}-${{ matrix.platform }}.cdx.json"
          test "$(find "$output" -maxdepth 1 -type f | wc -l | tr -d ' ')" -ge 4
      - name: 上传签名发行产物
        uses: actions/upload-artifact@v7
        with:
          name: magi-electron-${{ matrix.platform }}
          path: dist/package-assets
          if-no-files-found: error

  publish-release:
    name: 发布统一 Desktop 版本
    if: startsWith(github.ref, 'refs/tags/')
    needs: [prepare-release, package-desktop]
    runs-on: ubuntu-22.04
    steps:
      - name: 检出发布版本
        uses: actions/checkout@v7
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: 安装锁定依赖
        run: npm ci
      - name: 下载各平台产物
        uses: actions/download-artifact@v8
        with:
          pattern: magi-electron-*
          path: dist/platform-artifacts
      - name: 汇总产物并合并 Electron 更新元数据
        shell: bash
        run: |
          set -euo pipefail
          output=dist/release-assets
          mkdir -p "$output"
          while IFS= read -r file; do
            name="$(basename "$file")"
            [[ "$name" == latest*.yml ]] && continue
            test ! -e "$output/$name" || { echo "发行文件重名: $name" >&2; exit 1; }
            cp "$file" "$output/$name"
          done < <(find dist/platform-artifacts -type f -print)
          cp "$(find dist/platform-artifacts -path '*windows-x64*' -name latest.yml -print -quit)" "$output/latest.yml"
          cp "$(find dist/platform-artifacts -path '*linux-x64*' -name latest-linux.yml -print -quit)" "$output/latest-linux.yml"
          mapfile -t mac_metadata < <(find dist/platform-artifacts -path '*macos-*' -name latest-mac.yml -print | sort)
          test "${#mac_metadata[@]}" -eq 2
          node apps/desktop/scripts/merge-update-metadata.mjs --input "${mac_metadata[0]}" --input "${mac_metadata[1]}" --output "$output/latest-mac.yml" --assets-dir "$output"
          test "$(find "$output" -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')" -eq 2
          test "$(find "$output" -maxdepth 1 -name '*.zip' | wc -l | tr -d ' ')" -eq 2
          test "$(find "$output" -maxdepth 1 -name '*.AppImage' | wc -l | tr -d ' ')" -eq 1
          test "$(find "$output" -maxdepth 1 -name '*.deb' | wc -l | tr -d ' ')" -eq 1
          test "$(find "$output" -maxdepth 1 -name '*.exe' | wc -l | tr -d ' ')" -eq 1
          node apps/desktop/scripts/merge-update-metadata.mjs --input "$output/latest.yml" --output "$output/latest.yml" --assets-dir "$output"
          node apps/desktop/scripts/merge-update-metadata.mjs --input "$output/latest-linux.yml" --output "$output/latest-linux.yml" --assets-dir "$output"
      - name: 生成产品发布说明
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          notes_file=".github/releases/${tag}.md"
          test -s "$notes_file"
          cp "$notes_file" dist/release-notes.md
      - name: 生成哈希并使用发行密钥签名
        shell: bash
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PRIVATE_KEY_PASSWORD: ${{ secrets.RELEASE_GPG_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${RELEASE_GPG_PRIVATE_KEY:-}" || { echo "缺少签名 Secret: RELEASE_GPG_PRIVATE_KEY" >&2; exit 1; }
          test -n "${RELEASE_GPG_PRIVATE_KEY_PASSWORD:-}" || { echo "缺少签名 Secret: RELEASE_GPG_PRIVATE_KEY_PASSWORD" >&2; exit 1; }
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          key_id="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "$key_id"
          (cd dist/release-assets && sha256sum * > SHA256SUMS)
          while IFS= read -r file; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$RELEASE_GPG_PRIVATE_KEY_PASSWORD" --local-user "$key_id" --armor --detach-sign "$file"
            gpg --batch --verify "$file.asc" "$file"
          done < <(find dist/release-assets -maxdepth 1 -type f ! -name '*.asc' -print | sort)
          gpg --batch --armor --export "$key_id" > dist/release-assets/Magi-release-signing-public-key.asc
      - name: 生成 GitHub 构建来源证明
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/release-assets/*
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Magi ${{ github.ref_name }}
          body_path: dist/release-notes.md
          prerelease: ${{ contains(github.ref_name, 'test') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: dist/release-assets/*
          fail_on_unmatched_files: true
