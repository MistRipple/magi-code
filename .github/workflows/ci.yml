name: 持续集成

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  validate:
    name: 检查与测试
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装锁定依赖
        run: npm ci

      - name: 安装 Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && rustup default "$RUST_TOOLCHAIN"

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu-22.04-rust-1.97

      - name: 执行发布前置校验
        run: npm run release:preflight

      - name: 校验官方插件中心与源码一致
        run: npm run plugin-center:check

      - name: 验证插件隔离执行与取消
        run: |
          cargo test -p magi-plugin-runtime -p magi-plugin-system --all-targets --locked
          cargo build -p magi-plugin-runtime --bin magi-plugin-worker --locked
          ./target/debug/magi-plugin-worker --preflight
          ./target/debug/magi-plugin-worker --sandbox-selftest

  windows-desktop:
    name: Windows 桌面与进程策略
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装依赖并验证 Electron Desktop
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm run release:guard
          npm run check --workspace @magi/desktop
          npm run test --workspace @magi/desktop

      - name: 安装 Rust
        run: rustup toolchain install "$env:RUST_TOOLCHAIN" --profile minimal && rustup default "$env:RUST_TOOLCHAIN"

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-windows-2022-rust-1.97-gui
          cache-on-failure: true

      - name: 验证 Windows 子进程与桌面宿主
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test -p magi-core --test host_path --locked
          cargo test -p magi-workspace native_workspace_registration_keeps_authoritative_path_ref --locked
          cargo test -p magi-process --all-targets --locked
          cargo test -p magi-plugin-runtime --all-targets --locked
          cargo test -p magi-plugin-system --all-targets --locked
          cargo build -p magi-plugin-runtime --bin magi-plugin-worker --locked
          ./target/debug/magi-plugin-worker.exe --preflight
          cargo test -p magi-permissions --all-targets --locked
          cargo test -p magi-tool-runtime process_inspect_reports_current_process --locked
          cargo test -p magi-tool-runtime shell_path_parser_tests --locked
          cargo test -p magi-tool-runtime shell_argument_matches_selected_shell_dialect --locked
          cargo test -p magi-tool-runtime shell_exec_accepts_shell_program_with_arguments --locked
          cargo test -p magi-tool-runtime builtins_use_context_working_directory_for_relative_inputs --locked
          cargo test -p magi-api path_ref --locked
          cargo test -p magi-api file_reveal_target --locked
          cargo test -p magi-api background_job --locked
          cargo check -p magi-daemon --all-targets --locked

      - name: 构建 Windows Desktop 目录包
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm run desktop:package -- --dir

      - name: 验收打包 Windows 对话与恢复
        env:
          MAGI_ELECTRON_DOM_EVIDENCE_PATH: ${{ runner.temp }}/magi-electron-dom.json
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          try {
            node scripts/verify-electron-conversation-dom.mjs *> "$env:RUNNER_TEMP/magi-electron-dom.log"
          } finally {
            Get-Content "$env:RUNNER_TEMP/magi-electron-dom.log" -Tail 80
          }

      - name: 保留 Windows GUI 验收证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-electron-dom-evidence
          path: ${{ runner.temp }}/magi-electron-dom.*
          if-no-files-found: ignore

  macos-desktop:
    name: macOS 桌面与更新策略
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装依赖并验证 Electron Desktop
        run: |
          npm ci
          npm run release:guard
          npm run check --workspace @magi/desktop
          npm run test --workspace @magi/desktop

      - name: 安装 Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-macos-15-rust-1.97

      - name: 验证 macOS 路径、进程与更新策略
        run: |
          cargo test -p magi-core --test host_path --locked
          cargo test -p magi-process --all-targets --locked
          cargo test -p magi-plugin-runtime --all-targets --locked
          cargo test -p magi-plugin-system --all-targets --locked
          cargo build -p magi-plugin-runtime --bin magi-plugin-worker --locked
          ./target/debug/magi-plugin-worker --preflight
          ./target/debug/magi-plugin-worker --sandbox-selftest
          cargo check -p magi-daemon --all-targets --locked
